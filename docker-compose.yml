# OCFreeRelay 网关 — 直接使用 CNB 制品库构建好的多架构镜像
#
# 镜像由 CNB CI 流水线构建并推送到 docker.cnb.cool 制品库（见 .ci/.docker-build.yml）。
# 本地无需再打包：compose 直接拉取镜像运行。
#
# 用法：
#   docker compose up -d                              # 默认 latest
#   TAG=v0.1.0 docker compose up -d                   # 指定版本 tag

services:
  oc-free-relay:
    image: docker.cnb.cool/ansssde/tools/ocfreerelay:${TAG:-latest}
    container_name: oc-free-relay
    restart: unless-stopped
    ports:
      # Host port (left) → container port (right)
      # 默认 9876，可用 HOST_PORT 覆盖（如本机该端口被占用时）
      - "${HOST_PORT:-9876}:9876"
    volumes:
      # Persist settings / worker stats / free-model cache across restarts
      # 注意：data 目录需允许容器内 node(uid 1000) 写入，见 README 权限说明
      - ./data:/data
    environment:
      - PORT=9876
      - OCFREERELAY_SETTINGS_PATH=/data/settings.json
      - OCFREERELAY_STATS_PATH=/data/worker-stats.json
      # Optional — uncomment to synthesize OpenCode CLI identity headers
      # - OPENCODE_SYNTHESIZE_CLI_HEADERS=true
      # - OPENCODE_USER_AGENT=opencode-cli/1.0.0
      # - OPENCODE_CLIENT=cli
      # - OPENCODE_PROJECT=default
      # Optional — override the Zen pricing page used to scrape free models
      # - OCFREERELAY_PRICING_URL=https://opencode.ai/docs/zen
    # web UI served on 9876; the same port also serves /v1 OpenAI-compatible API